# Publish the studio to GitHub Pages.
#
# Gives you a permanent URL you can open on any device — including an iPad —
# without needing a computer to run `npm start`.
#
# The workflow sets the Pages source itself (see `enablement` below), so there
# is normally nothing to configure. If it still fails, set it by hand:
# Settings -> Pages -> Source: "GitHub Actions".
#
# Note it must be "GitHub Actions", not "Deploy from a branch". Branch
# deployment serves the repository root, where index.html is Vite's development
# entry point — it references unbundled source and will not run in a browser.
#
# (On a private repository, Pages needs a paid plan. If yours is private and
# you would rather not make it public, drag the `dist` folder onto
# app.netlify.com/drop instead — it hosts private static sites for free.)

name: Deploy studio to Pages

on:
  push:
    branches: [main]
  # Deploy any other branch on demand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The postinstall environment check probes for ffmpeg and browsers, which
      # are irrelevant to a static build and only add noise here.
      - run: npm ci --ignore-scripts

      - run: npm run build

      # `enablement` lets the workflow switch Pages onto the GitHub Actions
      # source itself. Without it, a repository still set to "Deploy from a
      # branch" fails here with "Get Pages site failed ... Not Found", and the
      # legacy builder quietly serves the repository root instead — which is
      # Vite's dev entry point, referencing unbundled source no browser can run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
