# Publish the studio to GitHub Pages.
#
# Gives you a permanent URL you can open on any device — including an iPad —
# without needing a computer to run `npm start`.
#
# This is the *alternative* route, and is not what currently serves the site.
#
# The built site is committed at the repository root (see cli/build-pages.mjs),
# so Pages serves it straight from the branch with nothing to configure. That
# keeps a copy of the build in version control, which has to be refreshed with
# `npm run build:pages` whenever the source changes.
#
# This workflow removes that duty by building on every push — but it only takes
# effect once the repository's Pages source is set to "GitHub Actions"
# (Settings -> Pages). Until then it builds and uploads without being served,
# which is harmless. Once switched, the committed index.html and assets/ become
# redundant and can be deleted.

name: Deploy studio to Pages

on:
  push:
    branches: [main]
  # Deploy any other branch on demand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The postinstall environment check probes for ffmpeg and browsers, which
      # are irrelevant to a static build and only add noise here.
      - run: npm ci --ignore-scripts

      - run: npm run build

      # `enablement` lets the workflow switch Pages onto the GitHub Actions
      # source itself. Without it, a repository still set to "Deploy from a
      # branch" fails here with "Get Pages site failed ... Not Found", and the
      # legacy builder quietly serves the repository root instead — which is
      # Vite's dev entry point, referencing unbundled source no browser can run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
